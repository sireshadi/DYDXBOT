<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-900 p-4 text-gray-300">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Left side: Brand and page links -->
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-xl font-bold text-amber-500 hover:text-amber-400">Unhyreable</a>
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="hover:text-amber-400">Home</a></li>
                    <li><a href="dashboard.html" class="hover:text-amber-400 font-semibold text-white">Dashboard</a></li> <!-- Active style for Dashboard -->
                </ul>
            </div>
            <!-- Right side: User info and logout -->
            <div>
                <span id="userEmail" class="mr-4"></span> <!-- This will be populated by dashboard.js -->
                <button id="logoutButton" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div id="welcomeMessage" class="mb-6 text-2xl">Welcome!</div>

        <!-- Create New Funnel Link Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Create New Funnel Link</h2>
            <form id="createFunnelForm">
                <div class="mb-4">
                    <label for="pathIdentifier" class="block text-gray-700 text-sm font-bold mb-2">Desired Path (e.g., my-awesome-link):</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 text-sm text-gray-900 bg-gray-200 border border-r-0 border-gray-300 rounded-l-md">
                            unhyreable.com/
                        </span>
                        <input type="text" id="pathIdentifier" name="pathIdentifier" required
                               class="shadow appearance-none border rounded-r w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                               placeholder="your-unique-path">
                    </div>
                </div>
                <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Create Link
                </button>
            </form>
            <div id="createFunnelMessage" class="mt-3 text-sm"></div>
        </div>

        <!-- Existing Funnel Links Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">My Funnel Links</h2>
            <div id="funnelLinksTableContainer" class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Full URL</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Path</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Clicks</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Leads Generated</th>
                        </tr>
                    </thead>
                    <tbody id="funnelLinksTableBody">
                        <!-- Rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
                <p id="noFunnelLinksMessage" class="text-gray-500 mt-4 hidden">You haven't created any funnel links yet.</p>
            </div>
        </div>

        <!-- Referral Stats Section -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">My Referral Statistics</h2>
            <p class="text-gray-700">Total New Users Signed Up Via Your Referrals:
                <span id="referredSignupsCount" class="font-bold">Loading...</span>
            </p>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
